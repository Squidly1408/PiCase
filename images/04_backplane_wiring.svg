<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<title>PiCase backplane wiring</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8f84"/></marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1c"/></marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#1d2733"/></marker>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 L0 0 0 20" fill="none" stroke="#eef1f4" stroke-width="1"/></pattern>
  <pattern id="vent" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#3a4552"/><rect x="2" y="3" width="8" height="2" rx="1" fill="#1b232c"/><rect x="2" y="8" width="8" height="2" rx="1" fill="#1b232c"/></pattern>
</defs>
<rect width="1440" height="960" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" text-anchor="start" fill="#1d2733" >Backplane wiring - one slot (repeat for every slot)</text><text x="40" y="74" font-size="15" font-weight="400" text-anchor="start" fill="#5b6775" >Each Pi plugs into a right-angle 2x20 female header. Shared rails run the length of the backplane.</text><line x1="40" y1="90" x2="1400" y2="90" stroke="#9aa5b1" stroke-width="1" /><rect x="60" y="150" width="260" height="600" rx="12" fill="#dde7fb" stroke="#2f64d6" stroke-width="2" /><text x="190" y="180" font-size="17" font-weight="700" text-anchor="middle" fill="#1d2733" >Raspberry Pi</text><text x="190" y="200" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6775" >40-pin header (used pins)</text><text x="80" y="255" font-size="12" font-weight="600" text-anchor="start" fill="#5b6775" font-family="'DejaVu Sans Mono', monospace" >pin&#160;2,&#160;4</text><text x="300" y="255" font-size="13" font-weight="700" text-anchor="end" fill="#cc3b3b" >5V in</text><circle cx="320" cy="250" r="5" fill="#cc3b3b"/><text x="80" y="305" font-size="12" font-weight="600" text-anchor="start" fill="#5b6775" font-family="'DejaVu Sans Mono', monospace" >pin&#160;6,&#160;9,&#160;14,&#160;20,&#160;25,</text><text x="300" y="305" font-size="13" font-weight="700" text-anchor="end" fill="#1d2733" >GND</text><circle cx="320" cy="300" r="5" fill="#1d2733"/><text x="80" y="323" font-size="12" font-weight="600" text-anchor="start" fill="#5b6775" font-family="'DejaVu Sans Mono', monospace" >pin&#160;30,&#160;34,&#160;39</text><text x="80" y="375" font-size="12" font-weight="600" text-anchor="start" fill="#5b6775" font-family="'DejaVu Sans Mono', monospace" >pin&#160;1</text><text x="300" y="375" font-size="13" font-weight="700" text-anchor="end" fill="#a05a00" >3V3 out</text><circle cx="320" cy="370" r="5" fill="#a05a00"/><text x="80" y="425" font-size="12" font-weight="600" text-anchor="start" fill="#5b6775" font-family="'DejaVu Sans Mono', monospace" >pin&#160;8</text><text x="300" y="425" font-size="13" font-weight="700" text-anchor="end" fill="#d98a1c" >GPIO14 TXD</text><circle cx="320" cy="420" r="5" fill="#d98a1c"/><text x="80" y="475" font-size="12" font-weight="600" text-anchor="start" fill="#5b6775" font-family="'DejaVu Sans Mono', monospace" >pin&#160;10</text><text x="300" y="475" font-size="13" font-weight="700" text-anchor="end" fill="#d98a1c" >GPIO15 RXD</text><circle cx="320" cy="470" r="5" fill="#d98a1c"/><text x="80" y="525" font-size="12" font-weight="600" text-anchor="start" fill="#5b6775" font-family="'DejaVu Sans Mono', monospace" >pin&#160;11</text><text x="300" y="525" font-size="13" font-weight="700" text-anchor="end" fill="#d98a1c" >GPIO17 DE/RE</text><circle cx="320" cy="520" r="5" fill="#d98a1c"/><text x="80" y="595" font-size="12" font-weight="600" text-anchor="start" fill="#5b6775" font-family="'DejaVu Sans Mono', monospace" >pin&#160;29&#160;31&#160;33&#160;35</text><text x="300" y="595" font-size="13" font-weight="700" text-anchor="end" fill="#0e8f84" >GPIO5/6/13/19</text><circle cx="320" cy="590" r="5" fill="#0e8f84"/><text x="80" y="685" font-size="12" font-weight="600" text-anchor="start" fill="#5b6775" font-family="'DejaVu Sans Mono', monospace" >pin&#160;37</text><text x="300" y="685" font-size="13" font-weight="700" text-anchor="end" fill="#2e9d4f" >GPIO26 LED</text><circle cx="320" cy="680" r="5" fill="#2e9d4f"/><line x1="980" y1="230" x2="1400" y2="230" stroke="#cc3b3b" stroke-width="5" /><text x="1400" y="220" font-size="13" font-weight="700" text-anchor="end" fill="#cc3b3b" >5V rail (from buck converter)</text><line x1="980" y1="300" x2="1400" y2="300" stroke="#1d2733" stroke-width="5" /><text x="1400" y="290" font-size="13" font-weight="700" text-anchor="end" fill="#1d2733" >GND rail</text><line x1="980" y1="820" x2="1400" y2="820" stroke="#d98a1c" stroke-width="3" /><text x="1400" y="810" font-size="13" font-weight="700" text-anchor="end" fill="#d98a1c" >RS-485  A</text><line x1="980" y1="860" x2="1400" y2="860" stroke="#d98a1c" stroke-width="3" /><text x="1400" y="850" font-size="13" font-weight="700" text-anchor="end" fill="#d98a1c" >RS-485  B</text><line x1="320" y1="250" x2="440" y2="250" stroke="#cc3b3b" stroke-width="3" /><rect x="440" y="232" width="90" height="36" rx="18" fill="#f0c75e" stroke="#1d2733" stroke-width="1.5" /><text x="485" y="255" font-size="12" font-weight="700" text-anchor="middle" fill="#1d2733" >PTC 3 A</text><line x1="530" y1="250" x2="620" y2="250" stroke="#cc3b3b" stroke-width="3" /><rect x="620" y="230" width="110" height="40" rx="6" fill="#f9dddd" stroke="#cc3b3b" stroke-width="1.5" /><text x="675" y="255" font-size="12" font-weight="700" text-anchor="middle" fill="#cc3b3b" >slot switch</text><path d="M730,250 L860,250 L860,230 L980,230" stroke="#cc3b3b" stroke-width="3" fill="none" /><circle cx="980" cy="230" r="6" fill="#cc3b3b"/><text x="560" y="216" font-size="12" font-weight="400" text-anchor="start" fill="#5b6775" >per-slot power so you can add a Pi while the rest keep running</text><line x1="320" y1="300" x2="980" y2="300" stroke="#1d2733" stroke-width="3" /><circle cx="980" cy="300" r="6" fill="#1d2733"/><rect x="560" y="360" width="240" height="260" rx="10" fill="#fbecd3" stroke="#d98a1c" stroke-width="2" /><text x="700" y="390" font-size="16" font-weight="700" text-anchor="middle" fill="#8a5508" >3.3 V RS-485</text><text x="700" y="410" font-size="13" font-weight="400" text-anchor="middle" fill="#8a5508" >transceiver module</text><text x="700" y="428" font-size="11" font-weight="400" text-anchor="middle" fill="#5b6775" >(MAX3485 / SP3485 class)</text><text x="572" y="390" font-size="12" font-weight="700" text-anchor="start" fill="#1d2733" font-family="'DejaVu Sans Mono', monospace" >VCC</text><text x="572" y="425" font-size="12" font-weight="700" text-anchor="start" fill="#1d2733" font-family="'DejaVu Sans Mono', monospace" >DI</text><text x="572" y="475" font-size="12" font-weight="700" text-anchor="start" fill="#1d2733" font-family="'DejaVu Sans Mono', monospace" >RO</text><text x="572" y="525" font-size="12" font-weight="700" text-anchor="start" fill="#1d2733" font-family="'DejaVu Sans Mono', monospace" >DE+RE</text><text x="572" y="575" font-size="12" font-weight="700" text-anchor="start" fill="#1d2733" font-family="'DejaVu Sans Mono', monospace" >GND</text><text x="788" y="430" font-size="12" font-weight="400" text-anchor="start" fill="#1d2733" ></text><text x="788" y="475" font-size="13" font-weight="700" text-anchor="end" fill="#1d2733" font-family="'DejaVu Sans Mono', monospace" >A</text><text x="788" y="525" font-size="13" font-weight="700" text-anchor="end" fill="#1d2733" font-family="'DejaVu Sans Mono', monospace" >B</text><path d="M320,370 L470,370 L470,385 L560,385" stroke="#a05a00" stroke-width="2" fill="none" /><line x1="320" y1="420" x2="560" y2="420" stroke="#d98a1c" stroke-width="2" /><line x1="320" y1="470" x2="560" y2="470" stroke="#d98a1c" stroke-width="2" /><line x1="320" y1="520" x2="560" y2="520" stroke="#d98a1c" stroke-width="2" /><path d="M560,570 L500,570 L500,300" stroke="#1d2733" stroke-width="2" fill="none" /><circle cx="500" cy="300" r="4" fill="#1d2733"/><text x="340" y="412" font-size="11" font-weight="600" text-anchor="start" fill="#5b6775" >TX → DI</text><text x="340" y="462" font-size="11" font-weight="600" text-anchor="start" fill="#5b6775" >RX ← RO</text><text x="340" y="512" font-size="11" font-weight="600" text-anchor="start" fill="#5b6775" >high = transmit</text><path d="M800,470 L900,470 L900,820 L980,820" stroke="#d98a1c" stroke-width="2.5" fill="none" /><path d="M800,520 L870,520 L870,860 L980,860" stroke="#d98a1c" stroke-width="2.5" fill="none" /><circle cx="980" cy="820" r="5" fill="#d98a1c"/><circle cx="980" cy="860" r="5" fill="#d98a1c"/><rect x="1227" y="826" width="26" height="28" rx="3" fill="#fff" stroke="#1d2733" stroke-width="1.5" /><line x1="1240" y1="820" x2="1240" y2="826" stroke="#1d2733" stroke-width="1.5" /><line x1="1240" y1="854" x2="1240" y2="860" stroke="#1d2733" stroke-width="1.5" /><text x="1290" y="900" font-size="12" font-weight="600" text-anchor="end" fill="#5b6775" >120 Ω terminator at BOTH ends of the bus</text><rect x="400" y="645" width="400" height="115" rx="10" fill="#d6f0ed" stroke="#0e8f84" stroke-width="1.5" /><text x="420" y="746" font-size="13" font-weight="700" text-anchor="start" fill="#0e8f84" >Slot ID straps - example: slot 5 = 0101</text><line x1="450" y1="630" x2="450" y2="690" stroke="#0e8f84" stroke-width="2" /><text x="450" y="720" font-size="11" font-weight="700" text-anchor="middle" fill="#0e8f84" >bit0</text><path d="M438,696 h24 M442,702 h16 M446,708 h8" stroke="#1d2733" stroke-width="2" fill="none" /><text x="476" y="700" font-size="10" font-weight="700" text-anchor="start" fill="#1d2733" >GND</text><line x1="540" y1="630" x2="540" y2="690" stroke="#0e8f84" stroke-width="2" /><text x="540" y="720" font-size="11" font-weight="700" text-anchor="middle" fill="#0e8f84" >bit1</text><text x="548" y="700" font-size="10" font-weight="400" text-anchor="start" fill="#5b6775" >open</text><line x1="630" y1="630" x2="630" y2="690" stroke="#0e8f84" stroke-width="2" /><text x="630" y="720" font-size="11" font-weight="700" text-anchor="middle" fill="#0e8f84" >bit2</text><path d="M618,696 h24 M622,702 h16 M626,708 h8" stroke="#1d2733" stroke-width="2" fill="none" /><text x="656" y="700" font-size="10" font-weight="700" text-anchor="start" fill="#1d2733" >GND</text><line x1="720" y1="630" x2="720" y2="690" stroke="#0e8f84" stroke-width="2" /><text x="720" y="720" font-size="11" font-weight="700" text-anchor="middle" fill="#0e8f84" >bit3</text><text x="728" y="700" font-size="10" font-weight="400" text-anchor="start" fill="#5b6775" >open</text><path d="M320,590 L380,590 L380,630 L720,630" stroke="#0e8f84" stroke-width="4" fill="none" /><text x="390" y="624" font-size="11" font-weight="600" text-anchor="start" fill="#0e8f84" >4 separate wires</text><text x="730" y="594" font-size="11" font-weight="400" text-anchor="start" fill="#1d2733" ></text><text x="400" y="780" font-size="11" font-weight="400" text-anchor="start" fill="#5b6775" >Grounded = 1 (Pi uses internal pull-ups). Solder jumpers or a 4-way DIP switch per slot.</text><line x1="320" y1="680" x2="360" y2="680" stroke="#2e9d4f" stroke-width="2" /><path d="M360,680 L360,840 L380,840" stroke="#2e9d4f" stroke-width="2" fill="none" /><rect x="380" y="830" width="60" height="20" rx="3" fill="#fff" stroke="#1d2733" stroke-width="1.5" /><text x="410" y="866" font-size="11" font-weight="600" text-anchor="middle" fill="#5b6775" >330 Ω</text><line x1="440" y1="840" x2="470" y2="840" stroke="#2e9d4f" stroke-width="2" /><path d="M470,828 L470,852 L492,840 Z" stroke="#2e9d4f" stroke-width="1.5" fill="#2e9d4f" /><line x1="492" y1="828" x2="492" y2="852" stroke="#2e9d4f" stroke-width="2" /><line x1="492" y1="840" x2="520" y2="840" stroke="#1d2733" stroke-width="2" /><path d="M520,830 v20 M526,834 v12 M532,838 v4" stroke="#1d2733" stroke-width="2" fill="none" /><text x="470" y="890" font-size="12" font-weight="600" text-anchor="middle" fill="#2e9d4f" >front-panel slot LED</text><rect x="980" y="360" width="420" height="400" rx="10" fill="#fff" stroke="#9aa5b1" stroke-width="1.2" /><text x="1000" y="390" font-size="16" font-weight="700" text-anchor="start" fill="#1d2733" >Build notes</text><text x="1000" y="420" font-size="13" font-weight="400" text-anchor="start" fill="#5b6775" >Use thick wire for 5 V/GND rails (≥ 1.5 mm² /</text><text x="1000" y="442" font-size="13" font-weight="400" text-anchor="start" fill="#5b6775" >16 AWG) and feed each 4-slot group separately.</text><text x="1000" y="464" font-size="13" font-weight="400" text-anchor="start" fill="#1d2733" ></text><text x="1000" y="486" font-size="13" font-weight="400" text-anchor="start" fill="#5b6775" >Set the bucks to 5.1 V measured AT the header,</text><text x="1000" y="508" font-size="13" font-weight="400" text-anchor="start" fill="#5b6775" >under load. Below ~4.9 V the Pi throttles -</text><text x="1000" y="530" font-size="13" font-weight="400" text-anchor="start" fill="#5b6775" >`casectl status` shows POWER WARN.</text><text x="1000" y="552" font-size="13" font-weight="400" text-anchor="start" fill="#1d2733" ></text><text x="1000" y="574" font-size="13" font-weight="400" text-anchor="start" fill="#5b6775" >Never hot-plug a powered header: switch the</text><text x="1000" y="596" font-size="13" font-weight="400" text-anchor="start" fill="#5b6775" >slot OFF, insert the Pi, then switch it ON.</text><text x="1000" y="618" font-size="13" font-weight="400" text-anchor="start" fill="#1d2733" ></text><text x="1000" y="640" font-size="13" font-weight="400" text-anchor="start" fill="#5b6775" >Leave pins 27/28 (HAT EEPROM) unconnected.</text><text x="1000" y="662" font-size="13" font-weight="400" text-anchor="start" fill="#1d2733" ></text><text x="1000" y="684" font-size="13" font-weight="400" text-anchor="start" fill="#5b6775" >Connect EVERY GND pin - it lowers noise and</text><text x="1000" y="706" font-size="13" font-weight="400" text-anchor="start" fill="#5b6775" >spreads the current.</text>
</svg>