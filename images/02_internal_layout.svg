" text-anchor="start" fill="#1d2733" >USB-A x2</text><rect x="984.0" y="500.0" width="18" height="20" rx="3" fill="#c9a227" stroke="#1d2733" stroke-width="1.2" /><line x1="1002.0" y1="510.0" x2="1030.0" y2="510.0" stroke="#5b6775" stroke-width="1" /><text x="1036.0" y="515.0" font-size="13" font-weight="600" text-anchor="start" fill="#1d2733" >Wi-Fi antenna</text><text x="1036.0" y="190.0" font-size="12" font-weight="700" text-anchor="start" fill="#5b6775" >RIGHT-SIDE I/O PANEL</text><rect x="500.0" y="520.0" width="170.0" height="140.0" rx="8" fill="#dde7fb" stroke="#2f64d6" stroke-width="1.5" /><text x="585.0" y="542.0" font-size="13" font-weight="700" text-anchor="middle" fill="#2f64d6" >Controller extras</text><text x="512.0" y="564.0" font-size="12" font-weight="400" text-anchor="start" fill="#1d2733" >USB-Ethernet (eth1)</text><text x="512.0" y="583.0" font-size="12" font-weight="400" text-anchor="start" fill="#1d2733" >  → side RJ45</text><text x="512.0" y="602.0" font-size="12" font-weight="400" text-anchor="start" fill="#1d2733" >USB Wi-Fi + antenna</text><text x="512.0" y="621.0" font-size="12" font-weight="400" text-anchor="start" fill="#1d2733" >HDMI → lid monitor</text><text x="512.0" y="640.0" font-size="12" font-weight="400" text-anchor="start" fill="#1d2733" >USB → keyboard</text><rect x="98.0" y="422.0" width="290" height="22" rx="4" fill="#cfe8da" stroke="none" stroke-width="0" /><text x="104.0" y="438.0" font-size="13" font-weight="700" text-anchor="start" fill="#1f7a4d" >BACKPLANE PCB (8 slots, 30 mm pitch)</text><text x="110.0" y="734.0" font-size="13" font-weight="600" text-anchor="start" fill="#bfeee8" >Airflow: rear fans blow along the gaps between blades,</text><text x="110.0" y="752.0" font-size="13" font-weight="600" text-anchor="start" fill="#bfeee8" >then out through the deck vents and front vents.</text><rect x="70" y="898.0" width="18" height="14" rx="3" fill="#dde7fb" stroke="#2f64d6" stroke-width="1.2" /><text x="96" y="910.0" font-s