<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<title>Adding a node</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8f84"/></marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1c"/></marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#1d2733"/></marker>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 L0 0 0 20" fill="none" stroke="#eef1f4" stroke-width="1"/></pattern>
  <pattern id="vent" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#3a4552"/><rect x="2" y="3" width="8" height="2" rx="1" fill="#1b232c"/><rect x="2" y="8" width="8" height="2" rx="1" fill="#1b232c"/></pattern>
</defs>
<rect width="1400" height="620" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" text-anchor="start" fill="#1d2733" >Adding a Raspberry Pi to the case</text><text x="40" y="74" font-size="15" font-weight="400" text-anchor="start" fill="#5b6775" >The rest of the cluster keeps running - only the slot you are filling is switched off.</text><line x1="40" y1="90" x2="1360" y2="90" stroke="#9aa5b1" stroke-width="1" /><rect x="40" y="120" width="320" height="450" rx="14" fill="#f2f4f7" stroke="#9aa5b1" stroke-width="1.2" /><circle cx="70" cy="150" r="12" fill="#0e8f84"/><text x="70" y="154.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >1</text><text x="92" y="156" font-size="18" font-weight="700" text-anchor="start" fill="#1d2733" >Prepare the card</text><text x="64" y="470" font-size="14" font-weight="400" text-anchor="start" fill="#5b6775" >Flash Raspberry Pi OS Lite</text><text x="64" y="494" font-size="14" font-weight="400" text-anchor="start" fill="#5b6775" >Run setup_worker.sh once</text><text x="64" y="518" font-size="14" font-weight="400" text-anchor="start" fill="#5b6775" >(same card works in any slot)</text><rect x="90" y="220" width="150" height="100" rx="8" fill="#dfe4ea" stroke="#1d2733" stroke-width="2" /><rect x="100" y="230" width="130" height="80" rx="4" fill="#0f1a22" stroke="none" stroke-width="0" /><text x="165" y="260" font-size="10" font-weight="400" text-anchor="middle" fill="#7ee08f" font-family="'DejaVu Sans Mono', monospace" >$&#160;sudo&#160;./setup_</text><text x="165" y="276" font-size="10" font-weight="400" text-anchor="middle" fill="#7ee08f" font-family="'DejaVu Sans Mono', monospace" >&#160;&#160;worker.sh</text><rect x="70" y="320" width="190" height="12" rx="4" fill="#c3cbd3" stroke="#1d2733" stroke-width="1.5" /><path d="M260,290 h50 l14,14 v56 h-64 z" stroke="#1d2733" stroke-width="2" fill="#2f64d6" /><rect x="270" y="332" width="44" height="22" rx="2" fill="#fff" stroke="none" stroke-width="0" /><text x="292" y="347" font-size="12" font-weight="700" text-anchor="middle" fill="#2f64d6" >SD</text><rect x="380" y="120" width="320" height="450" rx="14" fill="#f2f4f7" stroke="#9aa5b1" stroke-width="1.2" /><circle cx="410" cy="150" r="12" fill="#0e8f84"/><text x="410" y="154.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >2</text><text x="432" y="156" font-size="18" font-weight="700" text-anchor="start" fill="#1d2733" >Slot switch OFF</text><text x="404" y="470" font-size="14" font-weight="400" text-anchor="start" fill="#5b6775" >Lift the hinged deck</text><text x="404" y="494" font-size="14" font-weight="400" text-anchor="start" fill="#5b6775" >Flip the red switch for an</text><text x="404" y="518" font-size="14" font-weight="400" text-anchor="start" fill="#5b6775" >empty slot to OFF</text><rect x="430" y="240" width="220" height="130" rx="8" fill="#cfe8da" stroke="#1f7a4d" stroke-width="2" /><rect x="500" y="270" width="80" height="60" rx="6" fill="#2a2a2a" stroke="#1d2733" stroke-width="2" /><rect x="508" y="278" width="36" height="44" rx="4" fill="#cc3b3b" stroke="#1d2733" stroke-width="1.5" /><text x="470" y="306" font-size="13" font-weight="700" text-anchor="middle" fill="#1d2733" >OFF</text><text x="612" y="306" font-size="13" font-weight="700" text-anchor="middle" fill="#5b6775" >ON</text><circle cx="540" cy="352" r="9" fill="#56636f" stroke="#1d2733"/><rect x="720" y="120" width="320" height="450" rx="14" fill="#f2f4f7" stroke="#9aa5b1" stroke-width="1.2" /><circle cx="750" cy="150" r="12" fill="#0e8f84"/><text x="750" y="154.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >3</text><text x="772" y="156" font-size="18" font-weight="700" text-anchor="start" fill="#1d2733" >Slide the Pi in</text><text x="744" y="470" font-size="14" font-weight="400" text-anchor="start" fill="#5b6775" >Board into the card guide,</text><text x="744" y="494" font-size="14" font-weight="400" text-anchor="start" fill="#5b6775" >header onto the right-angle</text><text x="744" y="518" font-size="14" font-weight="400" text-anchor="start" fill="#5b6775" >socket. Plug the patch lead.</text><rect x="760" y="350" width="240" height="18" rx="3" fill="#cfe8da" stroke="#1f7a4d" stroke-width="2" /><rect x="810" y="328" width="120" height="22" rx="2" fill="#222" stroke="#1d2733" stroke-width="1.5" /><text x="870" y="343" font-size="10" font-weight="700" text-anchor="middle" fill="#ddd" >2x20 socket</text><rect x="800" y="200" width="140" height="112" rx="4" fill="#e7ece9" stroke="#1f7a4d" stroke-width="2" /><rect x="810" y="298" width="120" height="10" rx="1" fill="#333" stroke="none" stroke-width="0" /><text x="870" y="250" font-size="22" font-weight="700" text-anchor="middle" fill="#1f7a4d" >Pi</text><line x1="970" y1="210" x2="970" y2="290" stroke="#1d2733" stroke-width="2" marker-end="url(#arr)"/><rect x="944" y="188" width="22" height="140" rx="3" fill="#9aa5b1" stroke="none" stroke-width="0" /><text x="992" y="200" font-size="11" font-weight="600" text-anchor="start" fill="#5b6775" >guide</text><rect x="1060" y="120" width="320" height="450" rx="14" fill="#f2f4f7" stroke="#9aa5b1" stroke-width="1.2" /><circle cx="1090" cy="150" r="12" fill="#0e8f84"/><text x="1090" y="154.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >4</text><text x="1112" y="156" font-size="18" font-weight="700" text-anchor="start" fill="#1d2733" >Slot switch ON</text><text x="1084" y="470" font-size="14" font-weight="400" text-anchor="start" fill="#5b6775" >Slot LED lights in ~30 s.</text><text x="1084" y="494" font-size="14" font-weight="400" text-anchor="start" fill="#5b6775" >Dashboard: 'slot 05 joined'</text><text x="1084" y="518" font-size="14" font-weight="400" text-anchor="start" fill="#5b6775" >Then: casectl adopt 5</text><rect x="1110" y="240" width="220" height="130" rx="8" fill="#cfe8da" stroke="#1f7a4d" stroke-width="2" /><rect x="1180" y="270" width="80" height="60" rx="6" fill="#2a2a2a" stroke="#1d2733" stroke-width="2" /><rect x="1224" y="278" width="36" height="44" rx="4" fill="#cc3b3b" stroke="#1d2733" stroke-width="1.5" /><text x="1150" y="306" font-size="13" font-weight="700" text-anchor="middle" fill="#5b6775" >OFF</text><text x="1292" y="306" font-size="13" font-weight="700" text-anchor="middle" fill="#1d2733" >ON</text><circle cx="1220" cy="352" r="9" fill="#2e9d4f" stroke="#1d2733"/><circle cx="1220" cy="352" r="16" fill="none" stroke="#2e9d4f" stroke-width="2" opacity="0.5"/>
</svg>