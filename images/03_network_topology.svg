<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<title>PiCase network design</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker>
  <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8f84"/></marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a1c"/></marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"><circle cx="5" cy="5" r="4" fill="#1d2733"/></marker>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 L0 0 0 20" fill="none" stroke="#eef1f4" stroke-width="1"/></pattern>
  <pattern id="vent" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#3a4552"/><rect x="2" y="3" width="8" height="2" rx="1" fill="#1b232c"/><rect x="2" y="8" width="8" height="2" rx="1" fill="#1b232c"/></pattern>
</defs>
<rect width="1400" height="860" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" text-anchor="start" fill="#1d2733" >Network design</text><text x="40" y="74" font-size="15" font-weight="400" text-anchor="start" fill="#5b6775" >The controller is the only Pi that talks to the outside world. Workers sit on a private LAN behind it.</text><line x1="40" y1="90" x2="1360" y2="90" stroke="#9aa5b1" stroke-width="1" /><path d="M90,330 q-40,0 -40,-35 q0,-38 45,-38 q12,-38 60,-32 q35,-30 75,5 q45,0 45,38 q0,62 -50,62 z" stroke="#1d2733" stroke-width="1.8" fill="#eef3fb" /><text x="150" y="310" font-size="17" font-weight="700" text-anchor="middle" fill="#1d2733" >Internet</text><rect x="40" y="430" width="220" height="74" rx="10" fill="#dde7fb" stroke="#2f64d6" stroke-width="1.5" /><text x="150" y="462" font-size="15" font-weight="700" text-anchor="middle" fill="#1d2733" >Wi-Fi network</text><text x="150" y="484" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6775" >hotspot, venue, home</text><rect x="40" y="540" width="220" height="74" rx="10" fill="#e8ebef" stroke="#1d2733" stroke-width="1.5" /><text x="150" y="572" font-size="15" font-weight="700" text-anchor="middle" fill="#1d2733" >Wired network</text><text x="150" y="594" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6775" >any LAN wall socket</text><line x1="150" y1="360" x2="150" y2="428" stroke="#1d2733" stroke-width="1.5" marker-start="url(#arr)"/><path d="M262,577 L280,577 L280,360 L200,350" stroke="#1d2733" stroke-width="1.5" fill="none" marker-end="url(#arr)"/><rect x="330" y="120" width="1040" height="700" rx="18" fill="none" stroke="#5b6775" stroke-width="2" stroke-dasharray="10 6"/><text x="350" y="148" font-size="13" font-weight="700" text-anchor="start" fill="#5b6775" >INSIDE THE BRIEFCASE</text><rect x="400" y="330" width="330" height="300" rx="12" fill="#dde7fb" stroke="#2f64d6" stroke-width="2" /><text x="565" y="362" font-size="17" font-weight="700" text-anchor="middle" fill="#1d2733" >Controller Pi - slot 0</text><text x="565" y="384" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6775" >keyboard + monitor attached</text><rect x="418" y="402" width="294" height="56" rx="8" fill="#fff" stroke="#2f64d6" stroke-width="1.2" /><text x="432" y="424" font-size="14" font-weight="700" text-anchor="start" fill="#2f64d6" font-family="'DejaVu Sans Mono', monospace" >wlan0</text><text x="500" y="424" font-size="13" font-weight="700" text-anchor="start" fill="#1d2733" >Wi-Fi uplink</text><text x="500" y="444" font-size="12" font-weight="400" text-anchor="start" fill="#5b6775" >DHCP client · route metric 600</text><rect x="418" y="472" width="294" height="56" rx="8" fill="#fff" stroke="#2f64d6" stroke-width="1.2" /><text x="432" y="494" font-size="14" font-weight="700" text-anchor="start" fill="#2f64d6" font-family="'DejaVu Sans Mono', monospace" >eth1</text><text x="500" y="494" font-size="13" font-weight="700" text-anchor="start" fill="#1d2733" >Wired uplink (USB adapter)</text><text x="500" y="514" font-size="12" font-weight="400" text-anchor="start" fill="#5b6775" >behind side RJ45 · metric 100</text><rect x="418" y="542" width="294" height="56" rx="8" fill="#fff" stroke="#2f64d6" stroke-width="1.2" /><text x="432" y="564" font-size="14" font-weight="700" text-anchor="start" fill="#2f64d6" font-family="'DejaVu Sans Mono', monospace" >eth0</text><text x="500" y="564" font-size="13" font-weight="700" text-anchor="start" fill="#1d2733" >Internal LAN 10.42.0.1/24</text><text x="500" y="584" font-size="12" font-weight="400" text-anchor="start" fill="#5b6775" >DHCP server + DNS + NAT</text><path d="M262,467 L360,467 L360,440 L416,440" stroke="#2f64d6" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M262,577 L330,577 L380,510 L416,510" stroke="#1d2733" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="300" y="455" font-size="12" font-weight="600" text-anchor="start" fill="#2f64d6" >Wi-Fi</text><text x="338" y="600" font-size="12" font-weight="600" text-anchor="start" fill="#1d2733" >side RJ45</text><rect x="800" y="545" width="180" height="70" rx="10" fill="#dfe4ea" stroke="#1d2733" stroke-width="2" /><text x="890" y="576" font-size="15" font-weight="700" text-anchor="middle" fill="#1d2733" >8-port switch</text><text x="890" y="596" font-size="12" font-weight="400" text-anchor="middle" fill="#5b6775" >Gigabit, unmanaged</text><line x1="712" y1="580" x2="798" y2="580" stroke="#2f64d6" stroke-width="3" marker-end="url(#arr)"/><rect x="1080" y="172" width="250" height="56" rx="8" fill="#eef6f1" stroke="#1f7a4d" stroke-width="1.5" /><text x="1096" y="196" font-size="14" font-weight="700" text-anchor="start" fill="#1d2733" font-family="'DejaVu Sans Mono', monospace" >picase-node01</text><text x="1096" y="216" font-size="12" font-weight="400" text-anchor="start" fill="#5b6775" >slot 1 · 10.42.0.x (DHCP)</text><path d="M980,580 C1030,580 1030,200 1078,200" stroke="#4d84e8" stroke-width="2" fill="none" /><rect x="1080" y="244" width="250" height="56" rx="8" fill="#eef6f1" stroke="#1f7a4d" stroke-width="1.5" /><text x="1096" y="268" font-size="14" font-weight="700" text-anchor="start" fill="#1d2733" font-family="'DejaVu Sans Mono', monospace" >picase-node02</text><text x="1096" y="288" font-size="12" font-weight="400" text-anchor="start" fill="#5b6775" >slot 2 · 10.42.0.x (DHCP)</text><path d="M980,580 C1030,580 1030,272 1078,272" stroke="#4d84e8" stroke-width="2" fill="none" /><rect x="1080" y="316" width="250" height="56" rx="8" fill="#eef6f1" stroke="#1f7a4d" stroke-width="1.5" /><text x="1096" y="340" font-size="14" font-weight="700" text-anchor="start" fill="#1d2733" font-family="'DejaVu Sans Mono', monospace" >picase-node03</text><text x="1096" y="360" font-size="12" font-weight="400" text-anchor="start" fill="#5b6775" >slot 3 · 10.42.0.x (DHCP)</text><path d="M980,580 C1030,580 1030,344 1078,344" stroke="#4d84e8" stroke-width="2" fill="none" /><rect x="1080" y="388" width="250" height="56" rx="8" fill="#eef6f1" stroke="#1f7a4d" stroke-width="1.5" /><text x="1096" y="412" font-size="14" font-weight="700" text-anchor="start" fill="#1d2733" font-family="'DejaVu Sans Mono', monospace" >picase-node04</text><text x="1096" y="432" font-size="12" font-weight="400" text-anchor="start" fill="#5b6775" >slot 4 · 10.42.0.x (DHCP)</text><path d="M980,580 C1030,580 1030,416 1078,416" stroke="#4d84e8" stroke-width="2" fill="none" /><rect x="1080" y="460" width="250" height="56" rx="8" fill="#eef6f1" stroke="#1f7a4d" stroke-width="1.5" /><text x="1096" y="484" font-size="14" font-weight="700" text-anchor="start" fill="#1d2733" font-family="'DejaVu Sans Mono', monospace" >picase-node05</text><text x="1096" y="504" font-size="12" font-weight="400" text-anchor="start" fill="#5b6775" >slot 5 · 10.42.0.x (DHCP)</text><path d="M980,580 C1030,580 1030,488 1078,488" stroke="#4d84e8" stroke-width="2" fill="none" /><rect x="1080" y="532" width="250" height="56" rx="8" fill="#eef6f1" stroke="#1f7a4d" stroke-width="1.5" /><text x="1096" y="556" font-size="14" font-weight="700" text-anchor="start" fill="#1d2733" font-family="'DejaVu Sans Mono', monospace" >picase-node06</text><text x="1096" y="576" font-size="12" font-weight="400" text-anchor="start" fill="#5b6775" >slot 6 · 10.42.0.x (DHCP)</text><path d="M980,580 C1030,580 1030,560 1078,560" stroke="#4d84e8" stroke-width="2" fill="none" /><rect x="1080" y="604" width="250" height="56" rx="8" fill="#eef6f1" stroke="#1f7a4d" stroke-width="1.5" /><text x="1096" y="628" font-size="14" font-weight="700" text-anchor="start" fill="#1d2733" font-family="'DejaVu Sans Mono', monospace" >picase-node07</text><text x="1096" y="648" font-size="12" font-weight="400" text-anchor="start" fill="#5b6775" >slot 7 · 10.42.0.x (DHCP)</text><path d="M980,580 C1030,580 1030,632 1078,632" stroke="#4d84e8" stroke-width="2" fill="none" /><rect x="400" y="700" width="960" height="60" rx="10" fill="#fbecd3" stroke="#d98a1c" stroke-width="1.5" /><text x="420" y="726" font-size="15" font-weight="700" text-anchor="start" fill="#8a5508" >RS-485 management bus on the GPIO backplane</text><text x="420" y="746" font-size="12" font-weight="400" text-anchor="start" fill="#8a5508" >slot discovery · health &amp; temps · identify · reboot / shutdown · works even if Ethernet is down</text><line x1="565" y1="630" x2="565" y2="698" stroke="#d98a1c" stroke-width="3" stroke-dasharray="6 4"/><line x1="1345" y1="200" x2="1345" y2="698" stroke="#d98a1c" stroke-width="3" stroke-dasharray="6 4"/><line x1="1330" y1="200" x2="1345" y2="200" stroke="#d98a1c" stroke-width="3" /><line x1="1330" y1="272" x2="1345" y2="272" stroke="#d98a1c" stroke-width="3" /><line x1="1330" y1="344" x2="1345" y2="344" stroke="#d98a1c" stroke-width="3" /><line x1="1330" y1="416" x2="1345" y2="416" stroke="#d98a1c" stroke-width="3" /><line x1="1330" y1="488" x2="1345" y2="488" stroke="#d98a1c" stroke-width="3" /><line x1="1330" y1="560" x2="1345" y2="560" stroke="#d98a1c" stroke-width="3" /><line x1="1330" y1="632" x2="1345" y2="632" stroke="#d98a1c" stroke-width="3" /><rect x="400" y="160" width="600" height="140" rx="10" fill="#fff" stroke="#9aa5b1" stroke-width="1.2" /><text x="420" y="188" font-size="15" font-weight="700" text-anchor="start" fill="#1d2733" >How traffic flows</text><text x="420" y="214" font-size="13" font-weight="400" text-anchor="start" fill="#5b6775" >Cable in the side RJ45? → it wins (metric 100). Otherwise Wi-Fi.</text><text x="420" y="235" font-size="13" font-weight="400" text-anchor="start" fill="#5b6775" >Workers get 10.42.0.x from the controller and reach the</text><text x="420" y="256" font-size="13" font-weight="400" text-anchor="start" fill="#5b6775" >internet through it (NAT). They never use their own Wi-Fi.</text><text x="420" y="277" font-size="13" font-weight="400" text-anchor="start" fill="#5b6775" >Hostnames picase-node01..07 are kept in /etc/hosts.</text>
</svg>